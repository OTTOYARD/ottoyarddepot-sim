<!doctype html>
<!--
  OTTO-CLEAN ARM sandbox: one fast-charger stall, one car, both robots, the whole
  cleaning cycle. Everything is derived from the shipped modules (the car from
  vehicleBody, the doors from DOOR_GEO, the charge arm from buildCobot posed by poseFor,
  the cleaning arm from buildCleanArm posed by the real session reducer), so a picture
  here is a picture of what ships. The HUD prints the clearances the tests assert.

  Query params:
    ?t=95          seconds into the cycle (the reducer is stepped there from 0)
    ?total=348     the twin's step length, seconds (5.8 min default)
    ?toward=1      which column: 1 (port on the car's right) or -1
    ?view=iso      iso | far | port | top | front | inside | low | wide
    ?play=1        animate; ?speed=4 sim seconds per second
    ?oem=tesla     the car's family (the inlet it presents)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>OTTO-CLEAN ARM sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfe6ef; background: rgba(8,12,18,.82);
        border: 1px solid #24333f; border-radius: 6px; padding: 8px 10px;
        white-space: pre;
      }
      #hud b { color: #00e5ff; }
      .bad { color: #ff5a5a; }
      .good { color: #35d07f; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <script type="module" src="/src/devtools/cleanCheck.ts"></script>
  </body>
</html>
