# Q-A0: block committed credentials before they land. The logic lives in
# scripts/secret-scan.sh so pre-commit and CI cannot drift apart; this file
# only runs it. Deliberately no third-party scanner action: no license,
# no network fetch, same answer locally and in CI.
name: Secret Scan

on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scan
        run: bash scripts/secret-scan.sh
